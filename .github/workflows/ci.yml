name: framework-ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim
        env:
          ORACLE_PASSWORD: test
          APP_USER: test
          APP_USER_PASSWORD: test
        ports:
          - 1521:1521
        options: >-
          --health-cmd="healthcheck.sh"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=10

      wiremock:
        image: wiremock/wiremock:3.9.1
        ports:
          - 8080:8080   # API_BASE_URL target
          - 3000:8080   # same WireMock instance, also exposed as the web app's port
        options: >-
          --health-cmd="wget -qO- http://localhost:8080/__admin/health || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: "jdbc:oracle:thin:@//localhost:1521/XEPDB1"
      DB_USER: test
      DB_PASSWORD: test
      API_BASE_URL: http://localhost:8080

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile (with retry for transient Maven Central failures)
        run: |
          n=0
          until mvn -B -DskipTests compile; do
            n=$((n + 1))

            if [ "$n" -ge 3 ]; then
              echo "Compile failed after 3 attempts, giving up."
              exit 1
            fi

            echo "Attempt $n failed; retrying in 15 seconds..."
            sleep 15
          done

      - name: Stub health and login endpoints in WireMock
        run: |
          curl -s -X POST http://localhost:8080/__admin/mappings \
            -H "Content-Type: application/json" \
            -d '{
              "request": { "method": "GET", "url": "/health" },
              "response": { "status": 200, "jsonBody": { "status": "UP" } }
            }'

          curl -s -X POST http://localhost:8080/__admin/mappings \
            -H "Content-Type: application/json" \
            -d '{
              "request": { "method": "GET", "url": "/login" },
              "response": {
                "status": 200,
                "headers": { "Content-Type": "text/html" },
                "body": "<html><head><title>Login</title></head><body><form id=\"login\"><input name=\"username\"/><input name=\"password\" type=\"password\"/><button type=\"submit\">Log in</button></form></body></html>"
              }
            }'

      - name: Run core tests (not @mobile, not @web)
        run: |
          mvn -B test \
            -Dcucumber.filter.tags="not @mobile and not @web" \
            -DfailIfNoTests=false

      - name: Run @web tests
        run: |
          mvn -B test \
            -Dcucumber.filter.tags="@web" \
            -DfailIfNoTests=false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn