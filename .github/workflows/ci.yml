name: framework-ci
on: [pull_request, push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}

      - name: Compile (with retry for transient Maven Central 403s)
        run: |
          n=0
          until mvn -B -DskipTests compile; do
            n=$((n+1))
            if [ "$n" -ge 3 ]; then
              echo "Compile failed after 3 attempts, giving up."
              exit 1
            fi
            echo "Attempt $n failed, retrying in 15s..."
            sleep 15
          done

      - name: Run @api @smoke tests
        run: mvn -B test -Dcucumber.filter.tags="@api and @smoke and not @wip" -DfailIfNoTests=false

      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: allure-results, path: target/allure-results}