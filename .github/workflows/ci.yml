name: framework-ci

on:
  pull_request:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile (with retry for transient Maven Central failures)
        run: |
          n=0
          until mvn -B -DskipTests compile; do
            n=$((n + 1))

            if [ "$n" -ge 3 ]; then
              echo "Compile failed after 3 attempts, giving up."
              exit 1
            fi

            echo "Attempt $n failed; retrying in 15 seconds..."
            sleep 15
          done

      - name: Run @mobile and @web tests
        run: |
          mvn -B test \
            -Dcucumber.filter.tags="@mobile and @web" \
            -DfailIfNoTests=false

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
          if-no-files-found: warn